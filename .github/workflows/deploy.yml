name: Deploy to WordPress.org SVN

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy plugin to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies and build dist
        run: |
          npm ci
          npm run build
          bash bin/build-dist.sh

      - name: Get plugin version
        id: plugin_version
        run: |
          VERSION=$(grep -m1 'Version:' add-whatsapp-button.php | sed 's/.*Version: *//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org Plugin SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: add-whatsapp-button
          BUILD_DIR: dist
          VERSION: ${{ steps.plugin_version.outputs.version }}
